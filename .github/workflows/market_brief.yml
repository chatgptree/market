name: Daily Market Brief

on:
  schedule:
    # 7:00 AM AEST (Melbourne) = 9:00 PM UTC previous day, Mon-Fri
    - cron: '0 21 * * 0-4'
  workflow_dispatch:  # manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  run-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance openpyxl anthropic

      - name: Run market brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python market_brief.py

      - name: Commit and push index.html to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html Market_Brief.xlsx
          git commit -m "Market brief: $(date +'%d %b %Y')" || echo "Nothing to commit"
          git push
